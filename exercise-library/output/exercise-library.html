<title>Jamie Atlas Exercise Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Figtree:wght@400;500;600&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: #0d1016;
    --panel: #151a22;
    --panel-2: #1b212b;
    --line: #28303c;
    --text: #e8ecf2;
    --muted: #8f99a9;
    --glow: #ff6a2c;
    --rim: #9278ff;
    --good: #37d27c;
    --bad: #ff5048;
    --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
    --body: "Figtree", "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); color: var(--text); }
  body { font: 15px/1.5 var(--body); margin: 0; padding-inline: 16px; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--rim); outline-offset: 2px; }

  .top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-block: 18px 12px; max-width: 1240px; margin: 0 auto; flex-wrap: wrap; }
  .brand { font: 700 30px/1 var(--display); letter-spacing: 0.02em; text-transform: uppercase; margin: 0; text-wrap: balance; }
  .brand span { color: var(--glow); }
  .top p { margin: 0; color: var(--muted); font-size: 13px; }

  .layout { display: grid; gap: 20px; max-width: 1240px; margin: 0 auto; padding-block-end: 40px; }
  @media (min-width: 900px) { .layout { grid-template-columns: minmax(0, 1fr) 400px; align-items: start; } #preview { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); } }

  .search { display: grid; gap: 10px; }
  .search input[type=search] { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); font-size: 16px; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: 13px; }
  .chip[aria-pressed=true] { background: var(--text); color: var(--bg); border-color: var(--text); }
  .filters select { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; font-size: 13px; }
  .check { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); cursor: pointer; }
  .check input { accent-color: var(--glow); }
  .count { font: 600 14px var(--display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 6px 0 0; font-variant-numeric: tabular-nums; }

  #results { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; }
  @media (min-width: 640px) { #results { grid-template-columns: 1fr 1fr; } }
  .row { width: 100%; text-align: left; background: var(--panel); border: 1px solid transparent; border-radius: 12px; padding: 11px 13px; cursor: pointer; display: grid; gap: 3px; }
  .row:hover { border-color: var(--line); }
  .row.on { border-color: var(--glow); background: var(--panel-2); }
  .rn { font: 600 21px/1.1 var(--display); letter-spacing: 0.01em; }
  .rm { color: #ffb08c; font-size: 13px; }
  .rt { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
  .tag { font-size: 11px; padding: 1px 7px; border-radius: 5px; background: #222935; color: var(--muted); letter-spacing: 0.02em; }
  .tag.home { color: #9fd8ff; } .tag.gym { color: #d6c3ff; } .tag.both { color: #bfe8cf; }
  .tag.demo { color: #fff; background: linear-gradient(90deg, #7a2420, #1c6b3e); }
  .tag.rehab { color: #ffd98f; }
  .empty { color: var(--muted); padding: 20px 4px; }

  #preview { background: var(--panel); border-radius: 16px; padding: 14px; display: grid; gap: 12px; }
  .ph { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  #ex-name { font: 700 28px/1.05 var(--display); text-transform: uppercase; margin: 0; letter-spacing: 0.02em; }
  #ex-meta { color: var(--muted); font-size: 13px; margin: 2px 0 0; }
  #back { background: none; border: 0; color: var(--muted); font-size: 13px; cursor: pointer; padding: 0; white-space: nowrap; }
  @media (min-width: 900px) { #back { display: none; } }
  .screen { position: relative; margin: 0 auto; width: 100%; max-width: 372px; aspect-ratio: 9 / 16; border-radius: 14px; overflow: hidden; background: #0b0e13; }
  #comp { width: 100%; height: 100%; display: block; }
  .bar { position: absolute; left: 0; bottom: 0; height: 4px; width: 0; background: var(--glow); transition: width .1s linear; }
  .toggles { display: flex; flex-wrap: wrap; gap: 6px 14px; }
  .toggles .check { color: var(--text); }
  #split-note { font-size: 12px; color: var(--muted); margin: -6px 0 0; }
  fieldset { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px 12px; margin: 0; display: grid; gap: 8px; }
  legend { font: 600 13px var(--display); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); padding: 0 4px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  label.f { display: grid; gap: 3px; font-size: 12px; color: var(--muted); }
  label.f input, label.f select { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 15px; color: var(--text); width: 100%; min-width: 0; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn { border: 0; border-radius: 10px; padding: 11px 16px; font-weight: 600; cursor: pointer; background: var(--panel-2); border: 1px solid var(--line); }
  .btn.primary { background: var(--glow); color: #1b0d05; border-color: var(--glow); }
  .btn:disabled { opacity: .5; cursor: progress; }
  #status { min-height: 1.4em; font-size: 13px; color: var(--muted); margin: 0; }
  #video-out { display: grid; gap: 8px; }
  #video { width: 140px; aspect-ratio: 9/16; border-radius: 8px; background: #000; }
  .vo { display: flex; gap: 12px; align-items: flex-start; }
  .vo p { margin: 0; font-size: 12px; color: var(--muted); word-break: break-all; }
  #msg { width: 100%; min-height: 70px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; font-size: 13px; resize: vertical; }
  details { border-top: 1px solid var(--line); padding-top: 8px; }
  summary { cursor: pointer; font: 600 14px var(--display); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .info { display: grid; gap: 10px; margin-top: 8px; font-size: 14px; }
  .info h3 { margin: 0 0 2px; font: 600 13px var(--display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .info ul { margin: 0; padding-left: 18px; }
  .pills { display: flex; flex-wrap: wrap; gap: 5px; }
  .pill { font-size: 12px; padding: 2px 9px; border-radius: 999px; }
  .pill.prime { background: rgba(255,106,44,.18); color: #ffb08c; box-shadow: inset 0 0 0 1px rgba(146,120,255,.55); }
  .pill.second { background: #222935; color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { .bar { transition: none; } }
</style>

<header class="top">
  <h1 class="brand">Exercise <span>Library</span></h1>
  <p>Jamie Atlas Personal Training · preview, personalise and send</p>
</header>

<main class="layout">
  <section id="browse" aria-label="Find an exercise">
    <div class="search">
      <input id="q" type="search" placeholder="Search: glutes, dumbbell, knee rehab, plank…" autocomplete="off" aria-label="Search exercises">
      <div class="filters">
        <div class="chips" id="area" aria-label="Body area"></div>
        <div class="chips" id="where" aria-label="Where"></div>
      </div>
      <div class="filters">
        <select id="muscle" aria-label="Muscle"></select>
        <label class="check"><input id="rehab" type="checkbox"> Rehab-friendly</label>
        <label class="check"><input id="demo" type="checkbox"> Has right-vs-wrong demo</label>
      </div>
      <p class="count" id="count"></p>
    </div>
    <ul id="results"></ul>
  </section>

  <section id="preview" aria-label="Preview and send">
    <div class="ph">
      <div><h2 id="ex-name">Exercise</h2><p id="ex-meta"></p></div>
      <button id="back" type="button">↑ Back to list</button>
    </div>
    <div class="screen"><canvas id="comp" width="720" height="1280" aria-label="Animated exercise preview"></canvas><div class="bar" id="bar"></div></div>
    <div class="toggles">
      <label class="check"><input id="map" type="checkbox" checked> Muscle map</label>
      <label class="check"><input id="split" type="checkbox"> Right vs wrong</label>
      <label class="check"><input id="labelon" type="checkbox" checked> Client label</label>
    </div>
    <p id="split-note"></p>
    <fieldset>
      <legend>For your client</legend>
      <div class="two">
        <label class="f">First name<input id="client" autocomplete="off"></label>
        <label class="f">Sets and reps<input id="sets" autocomplete="off"></label>
      </div>
      <label class="f">Cue<select id="cue"></select></label>
      <label class="f">Or write your own cue<input id="cue-custom" placeholder="e.g. slow down on the way down" autocomplete="off"></label>
    </fieldset>
    <div class="actions">
      <button class="btn primary" id="make" type="button">Make video</button>
      <button class="btn" id="copy" type="button">Copy text message</button>
    </div>
    <p id="status" role="status"></p>
    <div id="video-out" hidden>
      <div class="vo">
        <video id="video" controls playsinline loop muted></video>
        <div style="display:grid;gap:8px">
          <p id="video-size"></p>
          <button class="btn primary" id="save" type="button">Save video</button>
          <p>Then attach it in WhatsApp or iMessage along with the text.</p>
        </div>
      </div>
    </div>
    <textarea id="msg" aria-label="Message to send" placeholder="Tap “Copy text message” and the note for your client appears here."></textarea>
    <details open>
      <summary>Coaching notes</summary>
      <div class="info">
        <div><h3>Muscles</h3><div class="pills" id="muscles"></div></div>
        <div><h3>Equipment</h3><span id="equip"></span></div>
        <div><h3>Cues</h3><ul id="cues"></ul></div>
        <div><h3>Common mistakes</h3><ul id="mistakes"></ul></div>
      </div>
    </details>
  </section>
</main>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script>
/* Motion library.
 *
 * Every exercise is a short loop between two or more key poses. A pose is a
 * set of joint angles in degrees:
 *   p, r, y   whole-body pitch (+ leans forward / face down), roll, yaw
 *   s, c, n   spine, chest and neck flexion (+ curls forward)
 *   st        spine twist
 *   L / R     per side: hf hip flexion, ha hip abduction, hr hip internal rotation,
 *             k knee flexion, an ankle (+ toes down), fl keep foot flat (0-1),
 *             sf shoulder flexion, sa shoulder abduction, h horizontal (+ toward front),
 *             sr arm rotation, e elbow flexion
 * `g` says how the body meets the world: which points touch the floor, which
 * stay anchored, which stay locked where they were in the first pose.
 */
(function () {
  const both = (limb) => ({ L: { ...limb }, R: { ...limb } });
  const merge = (...parts) => {
    const out = { L: {}, R: {} };
    for (const p of parts) {
      if (!p) continue;
      for (const k in p) {
        if (k === 'L' || k === 'R') Object.assign(out[k], p[k]);
        else out[k] = p[k];
      }
    }
    return out;
  };
  const mirror = (pose) => {
    const m = { ...pose, L: { ...(pose.R || {}) }, R: { ...(pose.L || {}) } };
    for (const k of ['r', 'y', 'st', 'sl']) if (m[k]) m[k] = -m[k];
    if (m.x) m.x = -m.x;
    return m;
  };

  const FEET = ['heelL', 'heelR', 'toeL', 'toeR'];
  const STAND_G = { ground: FEET, anchor: FEET };

  // Arm presets
  const ARMS = {
    hang: both({ sf: 0, sa: 8, e: 8 }),
    hips: both({ sf: -15, sa: 32, e: 95, sr: -40 }),
    cross: both({ sf: 62, sa: 22, e: 140, h: 25 }),
    forward: both({ sf: 88, sa: 8, e: 4 }),
    goblet: both({ sf: 28, sa: 14, e: 138, h: 20 }),
    backbar: both({ sf: -25, sa: 62, e: 118, sr: 70 }),
  };

  const STAND = merge(both({ ha: 5 }), ARMS.hang);

  const M = {};

  // ---------- LEGS ----------
  M.squat = (o = {}) => {
    const arms = ARMS[o.arms || 'forward'];
    const sumo = o.sumo ? both({ ha: 30, hr: -28 }) : null;
    const A = merge(STAND, arms, sumo, o.arms === 'forward' ? both({ sf: 88 }) : null);
    let B = merge(
      { p: 18, s: 24 },
      both({ hf: 108, k: 118, ha: 12 }),
      arms,
      sumo ? both({ ha: 38, hr: -30, hf: 98 }) : null,
      o.arms === 'forward' ? both({ sf: 128 }) : null,
      o.arms === 'hang' ? both({ sf: 42 }) : null,
    );
    if (o.sumo) B = merge(B, { p: 10, s: 10 }, both({ sf: o.arms === 'hang' ? 20 : undefined }));
    if (o.depth) B = merge(B, both({ hf: o.depth, k: o.depth + 8 }));
    return { poses: { A, B }, g: STAND_G, T: 2.6, faults: { knees_cave: 'B', heels_lift: 'B' } };
  };

  M.wallSit = () => {
    const base = merge({ s: -2 }, both({ hf: 88, k: 90, ha: 8 }), both({ sf: 45, sa: 12, e: 30 }));
    return {
      poses: { A: base, B: merge(base, { s: 1, n: 3 }) }, g: STAND_G, T: 3, hold: true,
      props: [{ type: 'wall', at: 'upperBack', gap: 0.0 }],
    };
  };

  M.sitToStand = () => ({
    poses: {
      A: merge({ p: 8, s: 8 }, both({ hf: 92, k: 92, ha: 8 }), ARMS.cross),
      B: merge(STAND, ARMS.cross),
    },
    g: STAND_G, T: 3,
    props: [{ type: 'chair', at: 'pelvisBottom', from: 'A' }],
    faults: { knees_cave: 'A' },
  });

  const split = (front, back, depth) => ({
    [front]: { hf: depth ? 88 : 28, k: depth ? 92 : 12, ha: 4 },
    [back]: { hf: depth ? -12 : -26, k: depth ? 100 : 18, an: depth ? 62 : 38, ha: 4 },
  });
  M.splitSquat = (o = {}) => {
    const arms = o.dumbbells ? ARMS.hang : ARMS.hips;
    return {
      poses: {
        A: merge({ s: 2 }, split('L', 'R', false), arms),
        B: merge({ s: 6 }, split('L', 'R', true), arms),
      },
      g: { ground: FEET, anchor: ['heelL', 'toeL'] }, T: 2.8,
      faults: { knees_cave: 'B' },
    };
  };

  M.reverseLunge = () => {
    const S = merge(STAND, ARMS.hips);
    const L = merge({ s: 6 }, split('L', 'R', true), ARMS.hips);
    return {
      poses: { S, L, R: mirror(L) }, seq: ['S', 'L', 'S', 'R'],
      g: { ground: FEET, anchor: FEET }, T: 2.6, cycles: 2,
    };
  };

  M.bulgarian = () => {
    const A = merge({ s: 8 }, { L: { hf: 22, k: 10 }, R: { hf: -34, k: 82, an: -60, fl: 0 } }, ARMS.hang);
    const B = merge({ s: 18, p: 4 }, { L: { hf: 92, k: 95 }, R: { hf: -8, k: 118, an: -60, fl: 0 } }, both({ sf: 18, sa: 8 }));
    return {
      poses: { A, B }, g: { ground: ['heelL', 'toeL'], anchor: ['heelL', 'toeL'] }, T: 2.8,
      props: [{ type: 'bench', under: ['toeR'], from: 'A', h: 'auto', len: 0.5, alongZ: true }],
      faults: { knees_cave: 'B' },
    };
  };

  M.stepUp = () => ({
    poses: {
      A: merge({ s: 10 }, { L: { hf: 68, k: 76 }, R: { hf: 0, k: 4 } }, ARMS.hang, { g: { ground: ['heelR', 'toeR'], anchor: ['heelL', 'toeL'], anchorAt: [0.09, 0.2] } }),
      B: merge({ s: 2 }, { L: { hf: 2, k: 4 }, R: { hf: 18, k: 34, an: 20, fl: 0 } }, ARMS.hang, { g: { ground: ['heelL', 'toeL'], groundY: 0.40, anchor: ['heelL', 'toeL'], anchorAt: [0.09, 0.2] } }),
    },
    g: {}, T: 3,
    props: [{ type: 'box', x: 0.09, z: 0.23, w: 0.5, d: 0.45, h: 0.40 }],
    faults: { knees_cave: 'A' },
  });

  M.lateralLunge = () => {
    const S = merge(both({ ha: 24 }), ARMS.cross);
    const L = merge({ p: 30, s: 14 }, { L: { hf: 92, k: 100, ha: 22 }, R: { hf: 24, k: 0, ha: 34 } }, ARMS.cross);
    return {
      poses: { S, L, R: mirror(L) }, seq: ['S', 'L', 'S', 'R'],
      g: { ground: FEET, anchor: FEET }, T: 2.6, cycles: 2,
    };
  };

  M.standingAbduction = () => ({
    poses: {
      A: merge(STAND, { R: { sa: 35, e: 40 }, L: { sa: 20 } }),
      B: merge(STAND, { sl: 0, L: { ha: 34, sa: 20 }, R: { sa: 35, e: 40 } }),
    },
    g: { ground: ['heelR', 'toeR'], anchor: ['heelR', 'toeR'], anchorAt: [-0.09, 0] }, T: 2.4,
  });

  M.bridge = (o = {}) => {
    const legsA = both({ hf: 48, k: 100 });
    if (o.single) legsA.R = { hf: 80, k: 8 };
    return {
      poses: {
        A: merge({ p: -90 }, legsA, both({ sf: 0, sa: 14, e: 2 })),
        B: merge({ p: -118 }, both({ hf: -4, k: 84 }), o.single ? { R: { hf: 8, k: 4 } } : null, both({ sf: -28, sa: 14, e: 2 })),
      },
      g: {
        level: { a: ['upperBack'], b: o.single ? ['heelL', 'toeL'] : FEET, axis: 'p', range: 30 },
        ground: ['upperBack', ...FEET], anchor: ['heelL', 'heelR'],
      },
      T: 2.6, faults: { arch_back: 'B' }, frame: 'wide',
      props: [{ type: 'mat', along: 'z' }],
    };
  };

  M.hinge = (o = {}) => {
    const kind = o.kind || 'rdl';
    const A = merge(STAND, both({ sf: 0, sa: 6, e: 4 }));
    let B;
    if (kind === 'rdl') B = merge({ p: 72, s: 2 }, both({ hf: 88, k: 20 }), both({ sf: 74, sa: 6, e: 4 }));
    if (kind === 'deadlift') B = merge({ p: 52, s: 6 }, both({ hf: 104, k: 78, ha: 10 }), both({ sf: 58, sa: 10, e: 2 }));
    if (kind === 'swing') {
      B = merge({ p: 70, s: 4 }, both({ hf: 92, k: 30, ha: 12 }), both({ sf: 20, sa: 4, e: 4 }));
      A.L.sf = A.R.sf = 90;
      A.L.sa = A.R.sa = 4;
    }
    return {
      poses: kind === 'swing' ? { A: B, B: A } : { A, B },
      g: STAND_G, T: kind === 'swing' ? 1.5 : 3,
      faults: { back_round: kind === 'swing' ? 'A' : 'B' },
    };
  };

  M.singleLegRdl = () => ({
    poses: {
      A: merge(STAND, { R: { hf: -4, k: 10, an: 20, fl: 0 } }),
      B: merge({ p: 76, s: 2 }, { L: { hf: 84, k: 16 }, R: { hf: -6, k: 4, an: -10, fl: 0 } }, both({ sf: 76, sa: 8, e: 4 })),
    },
    g: { ground: ['heelL', 'toeL'], anchor: ['heelL', 'toeL'] }, T: 3.2,
    faults: { back_round: 'B' },
  });

  M.calfRaise = (o = {}) => ({
    poses: {
      A: merge(STAND, o.seated ? null : ARMS.hips),
      B: merge(STAND, o.seated ? null : ARMS.hips, both({ an: 34 })),
    },
    g: { ground: FEET, anchor: ['toeL', 'toeR'] }, T: 2, frame: o.seated ? null : 'legs',
  });

  M.seatedCalf = () => ({
    poses: {
      A: merge(both({ hf: 90, k: 88, ha: 6 }), both({ sf: 22, sa: 10, e: 58 })),
      B: merge(both({ hf: 96, k: 88, ha: 6, an: 32 }), both({ sf: 24, sa: 10, e: 62 })),
    },
    g: { ground: FEET, anchor: FEET },
    props: [{ type: 'bench', under: ['pelvisBottom'], from: 'A', h: 'auto', len: 1.1 }, { type: 'dumbbellOn', at: ['kneeL', 'kneeR'] }],
    T: 2,
  });

  M.legPress = () => ({
    poses: {
      A: merge({ p: -52, yh: 0.62 }, both({ hf: 104, k: 18, ha: 10, an: -118, fl: 1 }), both({ sf: 20, sa: 30, e: 30 })),
      B: merge({ p: -52, yh: 0.62 }, both({ hf: 140, k: 108, ha: 14, an: -118, fl: 1 }), both({ sf: 20, sa: 30, e: 30 })),
    },
    g: {}, T: 2.8,
    props: [{ type: 'legPress' }],
    faults: { knees_cave: 'B' },
  });

  M.legCurl = () => ({
    poses: {
      A: merge({ p: 90 }, both({ hf: 0, k: 2, an: -70, fl: 0 }), both({ sf: 150, sa: 30, e: 60 })),
      B: merge({ p: 90 }, both({ hf: 4, k: 115, an: -70, fl: 0 }), both({ sf: 150, sa: 30, e: 60 })),
    },
    g: { ground: ['chestFront', 'hipFront'], groundY: 0.62, anchor: ['hipFront'] },
    props: [{ type: 'legCurl' }], T: 2.6,
  });

  M.legExtension = (o = {}) => ({
    poses: {
      A: merge({ p: -8, yh: 0.58 }, both({ hf: 90, k: 90, ha: 6, an: -10, fl: 0 }), both({ sf: 20, sa: 20, e: 30 })),
      B: merge({ p: -8, yh: 0.58 }, both({ hf: 90, k: 4, ha: 6, an: -10, fl: 0 }), both({ sf: 20, sa: 20, e: 30 })),
    },
    g: {}, T: 2.6,
    props: [o.chair ? { type: 'chair', at: 'pelvisBottom', from: 'A' } : { type: 'legExt' }],
  });

  const SIDE_LYING = (legs) => merge({ r: 90 }, legs,
    { R: { sf: 0, sa: 168, e: 60, sr: 0 }, L: { sf: 10, sa: 16, e: 50 } });
  M.clamshell = () => ({

<script type="module">
// Exercise preview engine: faceless 3D body, studio, equipment, muscle glow, camera.
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { Reflector } from 'three/addons/objects/Reflector.js';

const D2R = Math.PI / 180;
const V = () => new THREE.Vector3();
const SPHERE = new THREE.SphereGeometry(1, 32, 22);

export const MUSCLES = ['quads', 'hamstrings', 'glutes', 'glute_med', 'adductors', 'hip_flexors', 'calves', 'pecs', 'lats',
  'upper_back', 'traps', 'delts', 'rear_delts', 'biceps', 'triceps', 'forearms', 'abs', 'obliques', 'lower_back'];
const POSTERIOR = new Set(['hamstrings', 'glutes', 'calves', 'lats', 'upper_back', 'traps', 'rear_delts', 'triceps', 'lower_back', 'glute_med']);

function makeMaterials() {
  return {
    skin: new THREE.MeshStandardMaterial({ color: 0xb3b7be, roughness: 0.58, metalness: 0.04 }),
    shorts: new THREE.MeshStandardMaterial({ color: 0x141619, roughness: 0.82 }),
    glow: new THREE.MeshStandardMaterial({ color: 0xff6a2c, emissive: 0xff3c10, emissiveIntensity: 1.6, roughness: 0.45 }),
    glow2: new THREE.MeshStandardMaterial({ color: 0xd9784e, emissive: 0xa8401c, emissiveIntensity: 0.55, roughness: 0.5 }),
    rim: new THREE.MeshBasicMaterial({ color: new THREE.Color(0.55, 0.32, 2.2), side: THREE.BackSide, transparent: true, opacity: 0.9, depthWrite: false }),
    metal: new THREE.MeshStandardMaterial({ color: 0x2c3139, roughness: 0.32, metalness: 0.85 }),
    chrome: new THREE.MeshStandardMaterial({ color: 0x9aa3ad, roughness: 0.22, metalness: 0.95 }),
    rubber: new THREE.MeshStandardMaterial({ color: 0x0f1012, roughness: 0.6, metalness: 0.1 }),
    pad: new THREE.MeshStandardMaterial({ color: 0x121317, roughness: 0.78 }),
    mat: new THREE.MeshStandardMaterial({ color: 0x1c2029, roughness: 0.92 }),
    wall: new THREE.MeshStandardMaterial({ color: 0x1a1f27, roughness: 0.9 }),
    band: new THREE.MeshStandardMaterial({ color: 0x2f7d63, roughness: 0.55, emissive: 0x0a2a20, emissiveIntensity: 0.5 }),
    cable: new THREE.MeshStandardMaterial({ color: 0x0b0c0e, roughness: 0.5 }),
    bad: new THREE.MeshBasicMaterial({ color: new THREE.Color(3.2, 0.25, 0.2), transparent: true, opacity: 0.92 }),
    good: new THREE.MeshBasicMaterial({ color: new THREE.Color(0.3, 2.8, 0.7), transparent: true, opacity: 0.92 }),
  };
}

function lathe(len, radii, mat) {
  // Tapered limb pointing down -Y from its joint, rounded at both ends.
  const pts = [];
  const r0 = radii[0], r1 = radii[radii.length - 1];
  pts.push(new THREE.Vector2(0.0001, -len - r1 * 0.75));
  pts.push(new THREE.Vector2(r1 * 0.72, -len - r1 * 0.5));
  for (let i = radii.length - 1; i >= 0; i--) pts.push(new THREE.Vector2(radii[i], -len * (i / (radii.length - 1))));
  pts.push(new THREE.Vector2(r0 * 0.72, r0 * 0.5));
  pts.push(new THREE.Vector2(0.0001, r0 * 0.75));
  const m = new THREE.Mesh(new THREE.LatheGeometry(pts, 28), mat);
  m.castShadow = true;
  return m;
}

// ---------------------------------------------------------------- Figure
export class Figure {
  constructor(mats) {
    this.mats = mats;
    this.root = new THREE.Group();
    this.points = {};
    this.muscles = [];
    this.j = {};
    this.build();
  }

  ell(parent, pos, rad, mat, rot) {
    const m = new THREE.Mesh(SPHERE, mat);
    m.position.set(...pos);
    m.scale.set(...rad);
    if (rot) m.rotation.set(...rot);
    m.castShadow = true;
    parent.add(m);
    return m;
  }
  muscle(name, parent, pos, rad, rot, base) {
    const m = this.ell(parent, pos, rad, base || this.mats.skin, rot);
    const rim = new THREE.Mesh(SPHERE, this.mats.rim);
    const k = 0.014;
    rim.scale.set(1 + k / rad[0], 1 + k / rad[1], 1 + k / rad[2]);
    rim.visible = false;
    m.add(rim);
    this.muscles.push({ name, mesh: m, rim, base: base || this.mats.skin });
    return m;
  }
  point(name, parent, pos) {
    const o = new THREE.Object3D();
    o.position.set(...pos);
    parent.add(o);
    this.points[name] = o;
  }

  build() {
    const { skin, shorts } = this.mats;
    const R = this.root;
    // Pelvis (in shorts)
    this.ell(R, [0, -0.02, 0], [0.158, 0.12, 0.112], shorts);
    this.ell(R, [0, 0.04, 0], [0.142, 0.06, 0.1], shorts);
    for (const s of [1, -1]) {
      this.muscle('glutes', R, [s * 0.074, -0.065, -0.07], [0.086, 0.1, 0.072], null, shorts);
      this.muscle('glute_med', R, [s * 0.128, 0.0, -0.025], [0.05, 0.07, 0.06], null, shorts);
      this.muscle('hip_flexors', R, [s * 0.075, -0.045, 0.078], [0.042, 0.06, 0.032], [0, 0, s * 0.3], shorts);
    }
    this.point('pelvisBottom', R, [0, -0.15, -0.05]);
    this.point('pelvisBack', R, [0, -0.03, -0.135]);
    this.point('hipFront', R, [0, -0.05, 0.12]);
    this.point('pelvisSideL', R, [0.17, -0.05, 0]);
    this.point('pelvisSideR', R, [-0.17, -0.05, 0]);

    // Spine (lower torso)
    const spine = new THREE.Group(); spine.position.set(0, 0.06, 0); R.add(spine); this.j.spine = spine;
    this.ell(spine, [0, 0.09, 0], [0.132, 0.14, 0.098], skin);
    for (const row of [0.045, 0.1, 0.155]) for (const s of [1, -1])
      this.muscle('abs', spine, [s * 0.033, row, 0.078], [0.031, 0.03, 0.022]);
    for (const s of [1, -1]) {
      this.muscle('obliques', spine, [s * 0.1, 0.07, 0.035], [0.04, 0.1, 0.06]);
      this.muscle('lower_back', spine, [s * 0.042, 0.09, -0.068], [0.04, 0.11, 0.036]);
    }
    this.point('lowBack', spine, [0, 0.07, -0.11]);

    // Chest (upper torso)
    const chest = new THREE.Group(); chest.position.set(0, 0.18, 0); spine.add(chest); this.j.chest = chest;
    this.ell(chest, [0, 0.13, 0], [0.158, 0.19, 0.112], skin);
    for (const s of [1, -1]) {
      this.muscle('pecs', chest, [s * 0.074, 0.2, 0.078], [0.08, 0.062, 0.042], [0, 0, s * 0.18]);
      this.muscle('lats', chest, [s * 0.118, 0.1, -0.035], [0.056, 0.15, 0.075], [0, 0, s * 0.22]);
      this.muscle('upper_back', chest, [s * 0.06, 0.2, -0.086], [0.066, 0.09, 0.04]);
      this.muscle('traps', chest, [s * 0.07, 0.3, -0.032], [0.08, 0.04, 0.052], [0, 0, -s * 0.35]);
    }
    this.point('upperBack', chest, [0, 0.18, -0.125]);
    this.point('chestFront', chest, [0, 0.14, 0.125]);

    const neck = new THREE.Group(); neck.position.set(0, 0.31, 0); chest.add(neck); this.j.neck = neck;
    const nm = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.056, 0.13, 20), skin); nm.position.y = 0.05; nm.castShadow = true; neck.add(nm);
    const head = new THREE.Group(); head.position.set(0, 0.1, 0); neck.add(head);
    this.ell(head, [0, 0.1, 0.004], [0.084, 0.108, 0.098], skin);
    this.ell(head, [0, 0.038, 0.028], [0.066, 0.05, 0.07], skin);
    this.point('headTop', head, [0, 0.21, 0]);
    this.point('headBack', head, [0, 0.1, -0.1]);

    for (const [side, s] of [['L', 1], ['R', -1]]) {
      // Arm
      const sh = new THREE.Group(); sh.position.set(s * 0.198, 0.27, -0.01); chest.add(sh);
      const ua = new THREE.Group(); ua.rotation.order = 'XZY'; sh.add(ua);
      ua.add(lathe(0.29, [0.052, 0.05, 0.046, 0.042, 0.037], skin));
      this.muscle('delts', ua, [s * 0.01, -0.03, 0.016], [0.062, 0.08, 0.058]);
      this.muscle('rear_delts', ua, [s * 0.012, -0.035, -0.03], [0.05, 0.068, 0.044]);
      this.muscle('biceps', ua, [0, -0.15, 0.027], [0.04, 0.086, 0.04]);
      this.muscle('triceps', ua, [0, -0.14, -0.03], [0.043, 0.1, 0.04]);
      const fa = new THREE.Group(); fa.position.set(0, -0.29, 0); ua.add(fa);
      fa.add(lathe(0.25, [0.041, 0.043, 0.037, 0.03, 0.025], skin));
      this.muscle('forearms', fa, [0, -0.07, 0.004], [0.045, 0.085, 0.04]);
      this.point('elbow' + side, fa, [0, 0, -0.04]);
      const hand = new THREE.Group(); hand.position.set(0, -0.25, 0); fa.add(hand);
      this.ell(hand, [0, -0.055, 0.004], [0.028, 0.06, 0.045], skin);
      this.point('hand' + side, hand, [0, -0.07, 0]);
      this.j['sh' + side] = sh; this.j['ua' + side] = ua; this.j['fa' + side] = fa; this.j['hand' + side] = hand;

      // Leg
      const hip = new THREE.Group(); hip.rotation.order = 'XZY'; hip.position.set(s * 0.09, -0.07, 0); R.add(hip);
      hip.add(lathe(0.43, [0.085, 0.082, 0.074, 0.064, 0.054, 0.047], skin));
      const shortLeg = lathe(0.17, [0.094, 0.092, 0.089], shorts); hip.add(shortLeg);
      this.muscle('quads', hip, [0, -0.215, 0.03], [0.07, 0.18, 0.058]);
      this.muscle('hamstrings', hip, [0, -0.215, -0.03], [0.062, 0.17, 0.055]);
      this.muscle('adductors', hip, [-s * 0.045, -0.13, 0], [0.04, 0.12, 0.05]);
      const knee = new THREE.Group(); knee.position.set(0, -0.43, 0); hip.add(knee);
      this.ell(knee, [0, 0, 0.035], [0.04, 0.042, 0.03], skin);
      knee.add(lathe(0.42, [0.05, 0.055, 0.049, 0.04, 0.032, 0.027], skin));
      this.muscle('calves', knee, [0, -0.12, -0.034], [0.05, 0.11, 0.048]);
      this.point('knee' + side, knee, [0, 0, 0.06]);
      this.point('ankleBack' + side, knee, [0, -0.35, -0.06]);
      this.point('ankleFront' + side, knee, [0, -0.35, 0.06]);
      const ankle = new THREE.Group(); ankle.position.set(0, -0.42, 0); knee.add(ankle);
      this.ell(ankle, [0, -0.045, 0.05], [0.045, 0.036, 0.12], skin);
      this.point('heel' + side, ankle, [0, -0.08, -0.04]);
      this.point('toe' + side, ankle, [0, -0.08, 0.16]);
      this.j['hip' + side] = hip; this.j['knee' + side] = knee; this.j['ankle' + side] = ankle;
    }
    this.groundAll = Object.keys(this.points).filter((k) => !['lowBack'].includes(k));
  }

  setHighlight(primary = [], secondary = []) {
    const P = new Set(primary), S = new Set(secondary);
    for (const m of this.muscles) {
      if (P.has(m.name)) { m.mesh.material = this.mats.glow; m.rim.visible = true; }
      else if (S.has(m.name)) { m.mesh.material = this.mats.glow2; m.rim.visible = false; }
      else { m.mesh.material = m.base; m.rim.visible = false; }
    }
  }

  apply(P) {
    const d = (v) => (v || 0) * D2R;
    const j = this.j;
    this.root.rotation.order = 'YXZ';
    this.root.rotation.set(d(P.p), d(P.y), d(P.r));
    this.root.position.set(P.x || 0, P.yh ?? 1.0, P.z || 0);
    j.spine.rotation.set(d(P.s), d((P.st || 0) * 0.5), d(P.sl));
    j.chest.rotation.set(d(P.c), d((P.st || 0) * 0.5), 0);
    j.neck.rotation.set(d(P.n), 0, 0);
    for (const [side, s] of [['L', 1], ['R', -1]]) {
      const l = P[side] || {};
      const hf = l.hf ?? 0, k = l.k ?? 2, fl = l.fl ?? 1;
      j['hip' + side].rotation.set(-d(hf), -s * d(l.hr), s * d(l.ha ?? 4));
      j['knee' + side].rotation.set(d(k), 0, 0);
      j['ankle' + side].rotation.set(-fl * d((P.p || 0) - hf + k) + d(l.an), 0, 0);
      j['sh' + side].rotation.set(0, -s * d(l.h), 0);
      j['ua' + side].rotation.set(-d(l.sf), s * d(l.sr), s * d(l.sa ?? 7));
      j['fa' + side].rotation.set(-d(l.e ?? 8), 0, 0);
    }
  }

  wp(name, out = V()) {
    if (name === 'handMid') {
      const a = this.points.handL.getWorldPosition(V()), b = this.points.handR.getWorldPosition(V());
      return out.copy(a).add(b).multiplyScalar(0.5);
    }
    return this.points[name].getWorldPosition(out);
  }
  centroid(names) {
    const c = V();
    for (const n of names) c.add(this.wp(n));
    return c.multiplyScalar(1 / names.length);
  }
  minY(names) {
    let m = Infinity;
    for (const n of names) m = Math.min(m, this.wp(n).y);
    return m;
  }
}

// ---------------------------------------------------------------- pose math
const LIMB_KEYS = ['hf', 'ha', 'hr', 'k', 'an', 'fl', 'sf', 'sa', 'h', 'sr', 'e'];
const LIMB_DEF = { hf: 0, ha: 4, hr: 0, k: 2, an: 0, fl: 1, sf: 0, sa: 7, h: 0, sr: 0, e: 8 };
const BODY_KEYS = ['p', 'r', 'y', 'x', 'z', 'yh', 's', 'c', 'n', 'st', 'sl'];
function full(P) {
  const o = { L: {}, R: {} };
  for (const k of BODY_KEYS) o[k] = P[k] ?? (k === 'yh' ? 1.0 : 0);
  for (const s of ['L', 'R']) for (const k of LIMB_KEYS) o[s][k] = P[s]?.[k] ?? LIMB_DEF[k];
  return o;
}
function lerpPose(a, b, w) {
  const o = { L: {}, R: {} };
  for (const k of BODY_KEYS) o[k] = a[k] + (b[k] - a[k]) * w;
  for (const s of ['L', 'R']) for (const k of LIMB_KEYS) o[s][k] = a[s][k] + (b[s][k] - a[s][k]) * w;
  return o;
}
function addPose(a, mod, w) {
  if (!mod || !w) return a;
  const o = { ...a, L: { ...a.L }, R: { ...a.R } };
  for (const k in mod) {
    if (k === 'L' || k === 'R') for (const q in mod[k]) o[k][q] += mod[k][q] * w;
    else o[k] += mod[k] * w;
  }
  return o;
}
const ease = (x) => x * x * (3 - 2 * x);

// ---------------------------------------------------------------- props
function box(w, h, d, mat) { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.castShadow = true; m.receiveShadow = true; return m; }
function cyl(r, len, mat, seg = 20) { const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, seg), mat); m.castShadow = true; return m; }
function rodBetween(mesh, a, b) {
  const d = V().subVectors(b, a);
  const len = d.length() || 0.0001;
  mesh.position.copy(a).addScaledVector(d, 0.5);
  mesh.scale.set(1, len, 1);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize());
}
function dumbbell(M, big = 1) {
  const g = new THREE.Group();
  const h = cyl(0.016, 0.15, M.chrome); h.rotation.z = Math.PI / 2; g.add(h);
  for (const s of [1, -1]) {
    const w = cyl(0.052 * big, 0.065, M.rubber, 6); w.rotation.z = Math.PI / 2; w.position.x = s * 0.105; g.add(w);
  }
  return g;
}
function kettlebell(M) {
  const g = new THREE.Group();
  const b = new THREE.Mesh(SPHERE, M.rubber); b.scale.set(0.1, 0.095, 0.1); b.position.y = -0.14; b.castShadow = true; g.add(b);
  const hdl = new THREE.Mesh(new THREE.TorusGeometry(0.06, 0.013, 10, 24, Math.PI), M.rubber); hdl.position.y = -0.06; hdl.rotation.z = 0; g.add(hdl);
  for (const s of [1, -1]) { const p = cyl(0.013, 0.06, M.rubber); p.position.set(s * 0.06, -0.07, 0); g.add(p); }
  return g;
}
function barbell(M, len = 2.0, plateR = 0.225) {
  const g = new THREE.Group();
  const bar = cyl(0.014, len, M.chrome); bar.rotation.z = Math.PI / 2; g.add(bar);
  if (plateR) for (const s of [1, -1]) {
    const p = cyl(plateR, 0.05, M.rubber, 36); p.rotation.z = Math.PI / 2; p.position.x = s * (len / 2 - 0.2); g.add(p);
    const c = cyl(0.03, 0.08, M.metal); c.rotation.z = Math.PI / 2; c.position.x = s * (len / 2 - 0.13); g.add(c);
  }
  return g;
}

// ---------------------------------------------------------------- Stage
const VIEWS = {
  side: [1, 0.16, 0.1], sideR: [-1, 0.16, 0.1], back: [0.12, 0.2, -1], front: [0.14, 0.16, 1], three: [0.8, 0.18, 0.85],
  threeBack: [0.85, 0.3, -0.7], low: [0.28, 0.02, -1], top: [0.05, 0.85, 1],
};

export class Stage {
  constructor(width = 720, height = 1280) {
    this.M = makeMaterials();
    const r = this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    r.setPixelRatio(1);
    r.setSize(width, height, false);
    r.toneMapping = THREE.ACESFilmicToneMapping;
    r.toneMappingExposure = 1.05;
    r.shadowMap.enabled = true;
    r.shadowMap.type = THREE.PCFSoftShadowMap;
    this.canvas = r.domElement;

    const scene = this.scene = new THREE.Scene();
    scene.background = this.backdrop();
    scene.fog = new THREE.Fog(0x10141b, 6, 14);
    this.camera = new THREE.PerspectiveCamera(30, width / height, 0.05, 40);

    // Floor: a dim mirror under a dark matte layer gives a subtle reflection.
    const mirror = new Reflector(new THREE.PlaneGeometry(30, 30), { textureWidth: 512, textureHeight: 512, color: 0x6c717a, clipBias: 0.003 });
    mirror.rotation.x = -Math.PI / 2; mirror.position.y = -0.002; scene.add(mirror);
    this.mirror = mirror;
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.MeshStandardMaterial({ color: 0x10141a, roughness: 0.95, transparent: true, opacity: 0.9 }));
    floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

    // Lights
    scene.add(new THREE.HemisphereLight(0x9fb0d0, 0x07090c, 0.55));
    const key = this.key = new THREE.DirectionalLight(0xfff1e6, 2.6);
    key.castShadow = true; key.shadow.mapSize.set(1024, 1024); key.shadow.radius = 6; key.shadow.bias = -0.0005;
    Object.assign(key.shadow.camera, { left: -2, right: 2, top: 2.5, bottom: -1.5, near: 0.5, far: 12 });
    scene.add(key, key.target);
    this.rimA = new THREE.DirectionalLight(0x7d9cff, 4.2);
    this.rimB = new THREE.DirectionalLight(0xb58cff, 3.0);
    this.fill = new THREE.DirectionalLight(0x8fa3c8, 0.5);
    scene.add(this.rimA, this.rimB, this.fill);

    this.figure = new Figure(this.M);
    scene.add(this.figure.root);
    this.props = new THREE.Group(); scene.add(this.props);
    this.glowBalls = [0, 1].map(() => { const m = new THREE.Mesh(SPHERE, this.M.bad); m.scale.setScalar(0.05); m.visible = false; scene.add(m); return m; });

    this.composer = new EffectComposer(r);
    this.composer.setPixelRatio(1);
    this.composer.addPass(new RenderPass(scene, this.camera));
    this.bloom = new UnrealBloomPass(new THREE.Vector2(width, height), 0.85, 0.55, 0.92);
    this.composer.addPass(this.bloom);
    this.composer.addPass(new OutputPass());
    this.size = [width, height];
  }

  backdrop() {
    const c = document.createElement('canvas'); c.width = 256; c.height = 512;
    const g = c.getContext('2d');

  setSize(w, h) {

  // ---- placing the body in the world
  place(P, g) {
    const f = this.figure;
    f.apply(P);
    const root = f.root;
    root.updateMatrixWorld(true);
    if (g.level) {
      const { a, b, axis = 'p', range = 30, off = 0 } = g.level;
      const base = P[axis] || 0;
      const fn = (v) => {
        f.apply({ ...P, [axis]: v });

        return (f.minY(a) - off) - f.minY(b);

      let lo = base - range, hi = base + range, flo = fn(lo), best = lo, bestF = Math.abs(flo), found = false;

  gFor(key) { const s = this.spec; return s.poseG?.[key] || s.poses[key]?.g || s.g || {}; }

  poseAt(t, variant) {

  pose(t, variant = 'normal') {

  // ---- load an exercise
  load(ex) {

    this.full = {};

    this.cycle = spec.T * spec.seq.length / 2;
    const fk = ex.fault && spec.faults?.[ex.fault];

    this.figure.setHighlight(ex.muscles, ex.secondary);

    this.lockTarget = null;
    const g0 = this.gFor(spec.seq[0]);

  clearAttached() {

  frameCamera() {
    const f = this.figure, spec = this.spec;
    const pts = [];
    const keys = Object.keys(spec.poses);
    const names = spec.frame === 'legs'
      ? ['kneeL', 'kneeR', 'heelL', 'heelR', 'toeL', 'toeR', 'hipFront', 'pelvisBack']

    for (const k of keys) {
      this.place(this.full[k], this.gFor(k));
      for (const u of this.updaters) u();
      for (const n of names) pts.push(f.wp(n));
    }
    if (spec.frame !== 'legs') {
      this.props.updateMatrixWorld(true);
      this.props.traverse((o) => {
        if (!o.isMesh || o.geometry.parameters?.width > 3 || o.userData.noFrame) return;
        const b = new THREE.Box3().setFromObject(o);
        if (b.max.y - b.min.y > 2.2) { b.min.y = Math.max(b.min.y, 0); b.max.y = Math.min(b.max.y, 2.45); }
        pts.push(b.min, b.max);

    }
    if (spec.frame === 'legs') pts.push(V().set(0, 0, 0));
    const box3 = new THREE.Box3().setFromPoints(pts);
    const c = box3.getCenter(V());
    const dir = V().set(...(VIEWS[this.ex.camera] || VIEWS.side)).normalize();
    const up = new THREE.Vector3(0, 1, 0);
    const fwd = dir.clone().negate();
    const right = V().crossVectors(fwd, up).normalize();
    const upv = V().crossVectors(right, fwd).normalize();
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity, z1 = -Infinity;
    for (const p of pts) {

      x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); z1 = Math.max(z1, z);
    }
    const cam = this.camera;
    const tanV = Math.tan((cam.fov * D2R) / 2);

    const fillH = split ? 0.78 : (spec.frame === 'legs' ? 0.7 : 0.6), fillW = 0.86;

    cam.lookAt(target);
    cam.updateMatrixWorld();

    // Light rig relative to the camera: key from front-left, two cool rims behind.
    this.key.position.copy(target).addScaledVector(dir, 3).addScaledVector(right, -2.2).addScaledVector(up, 3.2);
    this.key.target.position.copy(target);
    this.rimA.position.copy(target).addScaledVector(dir, -3).addScaledVector(right, 2.6).addScaledVector(up, 1.6);
    this.rimB.position.copy(target).addScaledVector(dir, -3).addScaledVector(right, -2.6).addScaledVector(up, 1.2);
    this.fill.position.copy(target).addScaledVector(dir, 2).addScaledVector(right, 2.5).addScaledVector(up, 0.5);
    this.pose(0);
  }

  render(t, variant = 'normal') {
    this.pose(t, variant);
    const glow = variant !== 'normal' && this.fault ? this.fault.glow : [];
    this.glowBalls.forEach((b, i) => {
      b.visible = !!glow[i];
      if (!glow[i]) return;
      b.material = variant === 'fault' ? this.M.bad : this.M.good;
      this.figure.wp(glow[i], b.position);
    });
    this.composer.render();
    return this.canvas;
  }
}

// ---------------------------------------------------------------- Muscle map thumbnails
export class MiniMap {
  constructor() {
    this.M = makeMaterials();
    this.M.skin.color.set(0x8e939b);
    this.M.shorts.color.set(0x1a1c20);
    const r = this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    r.setPixelRatio(1); r.setSize(150, 250, false);
    r.toneMapping = THREE.ACESFilmicToneMapping;
    this.scene = new THREE.Scene();
    this.scene.add(new THREE.HemisphereLight(0xc8d2e6, 0x101218, 1.4));
    const k = new THREE.DirectionalLight(0xffffff, 1.6); k.position.set(1, 2, 3); this.scene.add(k);
    const k2 = new THREE.DirectionalLight(0xffffff, 1.2); k2.position.set(-1, 2, -3); this.scene.add(k2);
    this.fig = new Figure(this.M);
    this.fig.apply(full({ L: { sa: 16, e: 10 }, R: { sa: 16, e: 10 } }));
    this.scene.add(this.fig.root);
    this.cam = new THREE.PerspectiveCamera(22, 150 / 250, 0.1, 20);
  }
  render(primary, secondary) {
    this.fig.setHighlight(primary, secondary);
    const views = { front: [0, 0, 1], back: [0, 0, -1], side: [1, 0, 0] };
    const out = {};
    for (const [name, d] of Object.entries(views)) {
      this.cam.position.set(d[0] * 5.4, 1.0, d[2] * 5.4);
      this.cam.lookAt(0, 0.92, 0);
      this.renderer.render(this.scene, this.cam);
      const c = document.createElement('canvas'); c.width = 150; c.height = 250;
      c.getContext('2d').drawImage(this.renderer.domElement, 0, 0);
      out[name] = c;
    }
    const post = primary.filter((m) => POSTERIOR.has(m)).length;
    out.best = post > primary.length / 2 ? 'back' : 'front';
    return out;
  }
}

export { full as fullPose };

// Library browser: search, preview, personalise, make the video, save or copy the message.

const EX = window.EXERCISES;
const LABEL = {
  quads: 'Quads', hamstrings: 'Hamstrings', glutes: 'Glutes', glute_med: 'Side glutes', adductors: 'Inner thighs',
  hip_flexors: 'Hip flexors', calves: 'Calves', pecs: 'Chest', lats: 'Lats', upper_back: 'Upper back', traps: 'Traps',
  delts: 'Shoulders', rear_delts: 'Rear shoulders', biceps: 'Biceps', triceps: 'Triceps', forearms: 'Forearms',
  abs: 'Abs', obliques: 'Obliques', lower_back: 'Lower back',
};
const $ = (s) => document.querySelector(s);
const store = {
  get(k, d) { try { const v = localStorage.getItem('exlib.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('exlib.' + k, JSON.stringify(v)); } catch { /* storage unavailable */ } },
};

const state = {
  q: '', area: 'All', where: 'Any', rehab: false, demo: false, muscle: '',
  current: null, showMap: true, split: false, label: true,
  client: store.get('client', 'Sam'), sets: '', cue: '', recording: false, video: null,
};

// ---------------------------------------------------------------- list
function haystack(e) {
  return [e.name, e.area, e.where, ...e.muscles.map((m) => LABEL[m]), ...e.secondary.map((m) => LABEL[m]),
    ...e.equipment, ...e.cues, e.rehab ? 'rehab' : '', e.fault ? 'right wrong form demo' : ''].join(' ').toLowerCase();
}
EX.forEach((e) => { e._hay = haystack(e); });

function filtered() {
  const words = state.q.toLowerCase().split(/\s+/).filter(Boolean);
  return EX.filter((e) =>
    (state.area === 'All' || e.area === state.area) &&
    (state.where === 'Any' || e.where === state.where.toLowerCase() || e.where === 'both') &&
    (!state.rehab || e.rehab) && (!state.demo || e.fault) &&
    (!state.muscle || e.muscles.includes(state.muscle) || e.secondary.includes(state.muscle)) &&
    words.every((w) => e._hay.includes(w)));
}

function renderList() {
  const list = filtered();
  $('#count').textContent = `${list.length} of ${EX.length}`;
  const ul = $('#results');
  ul.replaceChildren();
  if (!list.length) {
    const li = document.createElement('li'); li.className = 'empty';
    li.textContent = 'No exercises match. Clear a filter or try a muscle name like "glutes".';
    ul.append(li); return;
  }
  for (const e of list) {
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.className = 'row' + (state.current?.id === e.id ? ' on' : '');
    b.type = 'button';
    b.innerHTML = `<span class="rn"></span><span class="rm"></span><span class="rt"></span>`;
    b.querySelector('.rn').textContent = e.name;
    b.querySelector('.rm').textContent = e.muscles.map((m) => LABEL[m]).join(' · ');
    const tags = b.querySelector('.rt');
    const tag = (t, cls) => { const s = document.createElement('span'); s.className = 'tag ' + (cls || ''); s.textContent = t; tags.append(s); };
    tag(e.where === 'both' ? 'Home or gym' : e.where === 'home' ? 'Home' : 'Gym', e.where);
    if (e.equipment.length) tag(e.equipment[0]);
    if (e.fault) tag('Right vs wrong', 'demo');
    if (e.rehab) tag('Rehab', 'rehab');
    b.addEventListener('click', () => { select(e); if (matchMedia('(max-width: 899px)').matches) $('#preview').scrollIntoView({ behavior: 'smooth' }); });
    li.append(b); ul.append(li);
  }
}

function chips(el, values, key) {
  el.replaceChildren();
  for (const v of values) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.textContent = v;
    b.setAttribute('aria-pressed', state[key] === v);
    b.addEventListener('click', () => { state[key] = v; chips(el, values, key); renderList(); });
    el.append(b);
  }
}

// ---------------------------------------------------------------- preview
const W = 720, H = 1280;
let stage, mini, maps = null, clock = performance.now(), downloads = null;
const comp = $('#comp');
const ctx = comp.getContext('2d');

function select(e) {
  state.current = e;
  state.video = null;
  state.split = state.split && !!e.fault;
  state.sets = e.sets;
  state.cue = e.cues[0];
  try { history.replaceState(null, '', '#' + e.id); } catch { /* sandboxed */ }
  $('#ex-name').textContent = e.name;
  $('#ex-meta').textContent = `${e.area} · ${e.where === 'both' ? 'Home or gym' : e.where === 'home' ? 'Home' : 'Gym'} · Level ${e.level}`;
  $('#sets').value = e.sets;
  const sel = $('#cue');
  sel.replaceChildren(...e.cues.map((c) => new Option(c, c)));
  $('#cue-custom').value = '';
  $('#split').disabled = !e.fault;
  $('#split').checked = state.split;
  $('#split-note').textContent = e.fault ? `${window.FAULTS[e.fault].bad} vs ${window.FAULTS[e.fault].good.toLowerCase()}` : 'No right-vs-wrong demo for this one yet';
  const list = (id, items) => { const ul = $(id); ul.replaceChildren(...items.map((t) => { const li = document.createElement('li'); li.textContent = t; return li; })); };
  list('#cues', e.cues.map(cap));
  list('#mistakes', e.mistakes);
  $('#muscles').replaceChildren(
    ...e.muscles.map((m) => pill(LABEL[m], 'prime')),
    ...e.secondary.map((m) => pill(LABEL[m], 'second')));
  $('#equip').textContent = e.equipment.length ? e.equipment.join(', ') : 'None, just bodyweight';
  $('#video-out').hidden = true;
  $('#status').textContent = '';
  renderList();
  if (!stage) return;
  stage.load(e);
  applySize();
  maps = mini.render(e.muscles, e.secondary);
  clock = performance.now();
}
function pill(t, cls) { const s = document.createElement('span'); s.className = 'pill ' + cls; s.textContent = t; return s; }
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

function applySize() {
  if (state.split) stage.setSize(W, H / 2); else stage.setSize(W, H);
  stage.frameCamera();
}

// ---------------------------------------------------------------- 2D overlays
function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

function drawMap() {
  if (!maps) return;
  const x0 = 170, y0 = 30, tw = 120, th = 200, gap = 10;
  roundRect(x0 - 12, y0 - 8, tw * 3 + gap * 2 + 24, th + 16, 22);
  ctx.fillStyle = 'rgba(20,24,32,0.62)'; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 2; ctx.stroke();
  ['front', 'back', 'side'].forEach((v, i) => {
    const x = x0 + i * (tw + gap);
    ctx.drawImage(maps[v], 15, 10, 120, 230, x, y0, tw, th);
    if (v === maps.best) {
      ctx.save();
      ctx.shadowColor = '#ff3df2'; ctx.shadowBlur = 18;
      ctx.strokeStyle = '#ff5cf4'; ctx.lineWidth = 5;
      roundRect(x - 4, y0 - 2, tw + 8, th + 4, 14); ctx.stroke();
      ctx.restore();
    }
  });
}

function drawBadge(x, y, good) {
  ctx.save();
  ctx.shadowColor = good ? '#35e07a' : '#ff3b3b'; ctx.shadowBlur = 24;
  ctx.fillStyle = good ? '#1fa85a' : '#d8332f';
  ctx.beginPath(); ctx.arc(x, y, 34, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.beginPath();
  if (good) { ctx.moveTo(x - 15, y + 1); ctx.lineTo(x - 4, y + 12); ctx.lineTo(x + 16, y - 11); }
  else { ctx.moveTo(x - 12, y - 12); ctx.lineTo(x + 12, y + 12); ctx.moveTo(x + 12, y - 12); ctx.lineTo(x - 12, y + 12); }
  ctx.stroke();
}

function drawCaption(text, y, good) {
  ctx.font = '600 30px "Barlow Condensed", "Arial Narrow", sans-serif';
  const w = ctx.measureText(text).width + 36;
  roundRect(40, y, w, 50, 25);
  ctx.fillStyle = good ? 'rgba(20,90,50,0.8)' : 'rgba(120,24,22,0.82)'; ctx.fill();
  ctx.fillStyle = '#fff'; ctx.textBaseline = 'middle'; ctx.fillText(text, 58, y + 26);
}

function wrap(text, maxW) {
  const words = text.split(' '); const lines = []; let line = '';
  for (const w of words) {
    const t = line ? line + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t;
  }
  if (line) lines.push(line);
  return lines;
}

function cueText() {
  const custom = $('#cue-custom').value.trim();
  const cue = custom || $('#cue').value;
  const name = $('#client').value.trim();
  return name ? `${name}, ${cue}` : cap(cue);
}

function drawLabel() {
  const e = state.current;
  const x = 28, w = W - 56, y = H - 250, h = 222;
  const g = ctx.createLinearGradient(0, y - 80, 0, H);
  g.addColorStop(0, 'rgba(8,10,14,0)'); g.addColorStop(0.4, 'rgba(8,10,14,0.7)'); g.addColorStop(1, 'rgba(8,10,14,0.92)');
  ctx.fillStyle = g; ctx.fillRect(0, y - 80, W, H - y + 80);
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#fff';
  ctx.font = '700 56px "Barlow Condensed", "Arial Narrow", sans-serif';
  ctx.fillText(e.name.toUpperCase(), x, y + 52);
  const sets = $('#sets').value.trim();
  if (sets) {
    ctx.font = '600 32px "Barlow Condensed", "Arial Narrow", sans-serif';
    const sw = ctx.measureText(sets).width + 32;
    roundRect(x, y + 70, sw, 46, 10); ctx.fillStyle = '#ff6a2c'; ctx.fill();
    ctx.fillStyle = '#16100c'; ctx.fillText(sets, x + 16, y + 103);
  }
  ctx.font = '500 30px "Figtree", "Helvetica Neue", Arial, sans-serif';
  ctx.fillStyle = '#e8ecf2';
  wrap(cueText(), w).slice(0, 2).forEach((l, i) => ctx.fillText(l, x, y + 158 + i * 36));
  ctx.font = '600 20px "Figtree", "Helvetica Neue", Arial, sans-serif';
  ctx.fillStyle = 'rgba(232,236,242,0.55)';
  ctx.fillText('JAMIE ATLAS PERSONAL TRAINING', x, H - 26);
}

function frame(now) {
  requestAnimationFrame(frame);
  if (!stage || !state.current) return;
  if (document.hidden) return;
  const t = (now - clock) / 1000;
  if (state.split) {
    ctx.drawImage(stage.render(t, 'fault'), 0, 0);
    ctx.drawImage(stage.render(t, 'good'), 0, H / 2);
    ctx.fillStyle = 'rgba(255,255,255,0.14)'; ctx.fillRect(0, H / 2 - 2, W, 4);
    const f = window.FAULTS[state.current.fault];
    drawBadge(W - 70, 70, false); drawBadge(W - 70, H / 2 + 70, true);
    drawCaption(f.bad, 44, false); drawCaption(f.good, H / 2 + 44, true);
  } else {
    ctx.drawImage(stage.render(t, 'normal'), 0, 0);
    if (state.showMap) drawMap();
  }
  if (state.label) drawLabel();
}

// ---------------------------------------------------------------- video
function pickType() {
  const types = ['video/mp4;codecs=avc1.42E01E', 'video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'];
  return types.find((t) => window.MediaRecorder && MediaRecorder.isTypeSupported(t));
}

async function makeVideo() {
  if (state.recording || !stage) return;
  const type = pickType();
  if (!type) { $('#status').textContent = 'This browser cannot record video. Try Chrome or Safari.'; return; }
  const loops = Math.max(state.current && stage.spec.cycles || 3, Math.ceil(5 / stage.cycle));
  const dur = loops * stage.cycle;
  const stream = comp.captureStream(30);
  const rec = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: 5_000_000 });
  const chunks = [];
  rec.ondataavailable = (ev) => ev.data.size && chunks.push(ev.data);
  state.recording = true;
  $('#make').disabled = true;
  $('#video-out').hidden = true;
  clock = performance.now();
  rec.start(250);
  const t0 = performance.now();
  const tick = setInterval(() => {
    const s = (performance.now() - t0) / 1000;
    $('#status').textContent = `Recording ${Math.min(s, dur).toFixed(1)} of ${dur.toFixed(1)} s`;
    $('#bar').style.width = Math.min(100, (s / dur) * 100) + '%';
  }, 100);
  await new Promise((r) => setTimeout(r, dur * 1000 + 120));
  rec.stop();
  await new Promise((r) => { rec.onstop = r; });
  clearInterval(tick);
  stream.getTracks().forEach((t) => t.stop());
  const ext = type.includes('mp4') ? 'mp4' : 'webm';
  const blob = new Blob(chunks, { type: type.split(';')[0] });
  const client = $('#client').value.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-');
  state.video = { blob, ext, name: `${client ? client + '-' : ''}${state.current.id}${state.split ? '-right-vs-wrong' : ''}.${ext}` };
  const v = $('#video');
  if (v.src) URL.revokeObjectURL(v.src);
  v.src = URL.createObjectURL(blob);
  $('#video-out').hidden = false;
  $('#video-size').textContent = `${state.video.name} · ${(blob.size / 1e6).toFixed(1)} MB · ${dur.toFixed(1)} s`;
  $('#status').textContent = ext === 'mp4' ? 'Video ready.' : 'Video ready. This browser made a WebM file; Safari or recent Chrome make MP4, which WhatsApp prefers.';
  $('#bar').style.width = '0%';
  state.recording = false;
  $('#make').disabled = false;
}

async function saveVideo() {
  if (!state.video) return;
  const { blob, name } = state.video;
  if (downloads) {
    try { await downloads.save({ filename: name, data: blob }); $('#status').textContent = 'Saved. Attach it in WhatsApp or iMessage.'; }
    catch (err) { $('#status').textContent = err?.code === 'declined' ? 'Save cancelled.' : 'Could not save the video here.'; }
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; document.body.append(a); a.click(); a.remove();
  $('#status').textContent = 'Saved to your downloads.';
}

function message() {
  const e = state.current, name = $('#client').value.trim();
  const sets = $('#sets').value.trim();
  const custom = $('#cue-custom').value.trim() || $('#cue').value;
  return `${name ? 'Hi ' + name + '! ' : ''}Here's your ${e.name.toLowerCase()}${sets ? ': ' + sets : ''}. Key cue: ${custom}. Watch the video before you start. - Jamie`;
}
async function copyMessage() {
  const text = message();
  $('#msg').value = text;
  try { await navigator.clipboard.writeText(text); $('#status').textContent = 'Message copied.'; }
  catch { $('#msg').select(); $('#status').textContent = 'Select the message below and copy it.'; }
}

// ---------------------------------------------------------------- boot
function boot() {
  chips($('#area'), ['All', 'Legs', 'Push', 'Pull', 'Core', 'Mobility'], 'area');
  chips($('#where'), ['Any', 'Home', 'Gym'], 'where');
  const ms = $('#muscle');
  ms.append(new Option('Any muscle', ''), ...Object.entries(LABEL).map(([k, v]) => new Option(v, k)));
  ms.addEventListener('change', () => { state.muscle = ms.value; renderList(); });
  $('#q').addEventListener('input', (ev) => { state.q = ev.target.value; renderList(); });
  $('#rehab').addEventListener('change', (ev) => { state.rehab = ev.target.checked; renderList(); });
  $('#demo').addEventListener('change', (ev) => { state.demo = ev.target.checked; renderList(); });
  $('#map').addEventListener('change', (ev) => { state.showMap = ev.target.checked; });
  $('#labelon').addEventListener('change', (ev) => { state.label = ev.target.checked; });
  $('#split').addEventListener('change', (ev) => { state.split = ev.target.checked; if (stage) applySize(); });
  $('#client').value = state.client;
  $('#client').addEventListener('input', (ev) => store.set('client', ev.target.value));
  $('#make').addEventListener('click', makeVideo);
  $('#save').addEventListener('click', saveVideo);
  $('#copy').addEventListener('click', copyMessage);
  $('#back').addEventListener('click', () => $('#browse').scrollIntoView({ behavior: 'smooth' }));

  try {
    stage = new Stage(W, H);
    mini = new MiniMap();
  } catch (err) {
    $('#status').textContent = 'This device could not start 3D graphics, so previews are unavailable.';
  }
  const start = EX.find((e) => e.id === location.hash.slice(1)) || EX.find((e) => e.id === 'goblet-squat');
  select(start);
  requestAnimationFrame(frame);
  window.claude?.use?.('downloads').then((d) => { downloads = d; }).catch(() => {});
  window.__ready = true;
}

(document.fonts?.ready || Promise.resolve()).then(boot);

</script>
